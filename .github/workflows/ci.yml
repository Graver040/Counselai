name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build smoke test (app imports & wires all routers)
        # Clients (Supabase/Pinecone/OpenAI/Anthropic) are lazy, so this needs
        # no real credentials — it catches import/wiring breakage on every push.
        run: python -c "from app import create_app; create_app(); print('app builds OK')"

      - name: Run tests (if any)
        run: |
          pip install pytest
          pytest -q || [ $? -eq 5 ]   # exit code 5 = no tests collected; don't fail
